<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1813" />
    <title>8-Ball Pool</title>
  </head>
  <body>
    <main class="pool">
      <header class="topbar">
        <a id="city-link" hidden class="link" href="/city" data-i18n="city">Back to the city</a>
        <nav id="lang-seg" class="language" aria-label="Language" data-i18n-label="language">
          <button type="button" data-lang="ar" lang="ar" dir="rtl">العربية</button>
          <button type="button" data-lang="en" lang="en" dir="ltr">EN</button>
        </nav>
      </header>

      <section id="menu" aria-labelledby="title">
        <div class="menu-content">
          <div class="brand">
            <h1 id="title" data-i18n="title">8-Ball Pool</h1>
            <p data-i18n="intro">Practice your break or play a friend online.</p>
          </div>
          <div class="screen active" id="screen-main">
            <button class="primary" id="btn-solo" data-i18n="solo">Practice</button>
            <button id="btn-multi" data-i18n="multiplayer">Play online</button>
          </div>
          <div class="screen" id="screen-mp" hidden>
            <button class="primary" id="btn-create" data-i18n="create">Create room</button>
            <button id="btn-join" data-i18n="join">Join room</button>
            <button class="quiet" data-back="screen-main" data-i18n="back">Back</button>
          </div>
          <div class="screen" id="screen-host" hidden>
            <p data-i18n="hostHint">Share this room code with another city member.</p>
            <div class="code" id="host-code" dir="ltr">····</div>
            <p class="status" id="host-status" role="status"></p>
            <button class="quiet" data-back="screen-mp" data-i18n="back">Back</button>
          </div>
          <div class="screen" id="screen-join" hidden>
            <form id="join-form">
              <label for="join-code" data-i18n="joinHint">Room code</label>
              <input id="join-code" type="text" maxlength="4" placeholder="ABCD" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" />
              <button class="primary" type="submit" id="btn-connect" data-i18n="connect">Join game</button>
              <p class="status" id="join-status" role="status"></p>
            </form>
            <button class="quiet" data-back="screen-mp" data-i18n="back">Back</button>
          </div>
        </div>
      </section>

      <div class="table-area">
        <div id="hud" hidden>
          <div class="stats">
            <strong class="pill" id="hud-turn" role="status"></strong>
            <span class="pill" id="hud-group"></span>
            <span class="pill"><span data-i18n="shots">Shots</span> <b id="hud-shots">0</b></span>
            <span class="pill"><span data-i18n="potted">Pocketed</span> <b id="hud-potted" dir="ltr">0/15</b></span>
          </div>
          <div class="actions">
            <button id="btn-mute" data-i18n="mute">Mute</button>
            <button id="btn-restart" data-i18n="restart">New rack</button>
            <button id="btn-menu" data-i18n="menu">Menu</button>
          </div>
        </div>
        <div id="balls-left" hidden></div>
        <div id="app" inert>
          <div id="banner" aria-hidden="true"></div>
        </div>
        <div class="table-footer">
          <p id="hint" hidden></p>
          <span id="keyboard-help" class="visually-hidden"></span>
          <div id="power" hidden>
            <label for="power-level" data-i18n="power">Power</label>
            <meter id="power-level" min="0" max="1" value="0"></meter>
          </div>
        </div>
      </div>

      <p id="toast" role="status"></p>
      <p id="render-error" class="status error" role="alert" hidden data-i18n="renderError">The pool table could not load in this browser.</p>
    </main>

    <dialog id="confirm-modal" aria-labelledby="confirm-text">
      <form method="dialog">
        <p id="confirm-text"></p>
        <div class="actions">
          <button value="cancel" autofocus data-i18n="reject">Cancel</button>
          <button value="accept" class="primary" data-i18n="accept">Confirm</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
